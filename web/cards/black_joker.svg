<svg xmlns="http://www.w3.org/2000/svg" width="167.0869141pt" height="242.6669922pt" viewBox="0 0 167.0869141 242.6669922">
  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="166" height="241.6" rx="6.8" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" />
  
  <!-- Corner Labels (Black Joker / 小王) -->
  <text x="8" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">J</text>
  <text x="8" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">O</text>
  <text x="8" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">K</text>
  <text x="8" y="66" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">E</text>
  <text x="8" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">R</text>
  <text x="8" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">★</text>

  <!-- Bottom-Right Inverted Corner Labels -->
  <g transform="rotate(180 159 220)">
    <text x="151" y="202" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">J</text>
    <text x="151" y="216" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">O</text>
    <text x="151" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">K</text>
    <text x="151" y="244" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">E</text>
    <text x="151" y="258" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#1E293B">R</text>
  </g>

  <!-- Center Artwork: Silver / Slate Jester Crown (小王) -->
  <g transform="translate(83.5, 121.3)">
    <!-- Aura glow -->
    <circle cx="0" cy="0" r="48" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="0" cy="0" r="38" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />
    
    <!-- Crown -->
    <path d="M-28,14 L28,14 L24,24 L-24,24 Z" fill="#334155" stroke="#0F172A" stroke-width="1.5" />
    <path d="M-28,14 L-34,-14 L-12,0 L0,-24 L12,0 L34,-14 L28,14 Z" fill="#475569" stroke="#0F172A" stroke-width="1.5" />
    
    <!-- Crown Jewels -->
    <circle cx="-34" cy="-14" r="3.5" fill="#94A3B8" stroke="#334155" stroke-width="1" />
    <circle cx="0" cy="-24" r="4.5" fill="#CBD5E1" stroke="#334155" stroke-width="1" />
    <circle cx="34" cy="-14" r="3.5" fill="#94A3B8" stroke="#334155" stroke-width="1" />
    
    <circle cx="-16" cy="19" r="2.5" fill="#E2E8F0" />
    <circle cx="0" cy="19" r="3" fill="#E2E8F0" />
    <circle cx="16" cy="19" r="2.5" fill="#E2E8F0" />

    <!-- Center Label -->
    <rect x="-36" y="32" width="72" height="20" rx="4" fill="#334155" />
    <text x="0" y="46" font-family="'Microsoft YaHei', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">小 王</text>
  </g>
</svg>
