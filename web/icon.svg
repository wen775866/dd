<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Carbon / Felt Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14233c" />
      <stop offset="60%" stop-color="#08101e" />
      <stop offset="100%" stop-color="#02060d" />
    </radialGradient>
    
    <!-- Table Felt Green Radial Accent -->
    <radialGradient id="feltGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#022c22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#011812" stop-opacity="1" />
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Deep Spade Gradient -->
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.75" />

  <!-- Inner Casino Table Ring -->
  <circle cx="256" cy="225" r="175" fill="url(#feltGlow)" stroke="#064e3b" stroke-width="6" filter="url(#cardShadow)" />
  <circle cx="256" cy="225" r="165" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Center Black Spade ♠️ Main Icon -->
  <g transform="translate(256, 210)" filter="url(#cardShadow)">
    <!-- Base Spade Outer Silhouette -->
    <path d="M 0 -125 C -75 -45 -125 15 -125 65 C -125 115 -65 135 -15 102 C -2 98 0 94 0 94 C 0 94 2 98 15 102 C 65 135 125 115 125 65 C 125 15 75 -45 0 -125 Z" 
          fill="url(#spadeGrad)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Spade Base / Stem -->
    <path d="M 0 75 L -26 130 C -8 133 8 133 26 130 Z" 
          fill="url(#spadeGrad)" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linejoin="round" />
    
    <!-- Inner Gold Engraved Spade Detail -->
    <path d="M 0 -75 C -35 -20 -60 15 -60 42 C -60 70 -26 80 0 55 C 26 80 60 70 60 42 C 60 15 35 -20 0 -75 Z" 
          fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Bottom Badge: 烟三 -->
  <g transform="translate(256, 432)" filter="url(#goldGlow)">
    <rect x="-110" y="-28" width="220" height="56" rx="28" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2.5" />
    <text x="0" y="11" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="900" fill="#021c16" text-anchor="middle" letter-spacing="6">烟三</text>
  </g>
</svg>
