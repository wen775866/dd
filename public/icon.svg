<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="100%" stop-color="#799F0C" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f3f8" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEE21" />
      <stop offset="50%" stop-color="#FFD200" />
      <stop offset="100%" stop-color="#F7931E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#eab308" stroke-width="4" stroke-opacity="0.4" />

  <!-- Felt Table Inner Circle -->
  <circle cx="256" cy="256" r="210" fill="#0c4c2d" stroke="#052e16" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6,6" />

  <!-- Left Card (Ace of Spades) -->
  <g transform="translate(130, 150) rotate(-18)" filter="url(#glow)">
    <rect width="130" height="190" rx="14" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="3" />
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#0f172a">A</text>
    <!-- Spade Symbol -->
    <path d="M 65 85 C 50 115 25 130 50 148 C 65 158 65 140 65 140 C 65 140 65 158 80 148 C 105 130 80 115 65 85 Z" fill="#0f172a" />
    <path d="M 65 135 L 61 155 L 69 155 Z" fill="#0f172a" />
  </g>

  <!-- Right Card (Big Joker / King of Hearts) -->
  <g transform="translate(250, 150) rotate(18)" filter="url(#glow)">
    <rect width="130" height="190" rx="14" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="3" />
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#dc2626">2</text>
    <!-- Heart Symbol -->
    <path d="M 65 145 C 65 145 30 118 30 95 C 30 80 42 70 55 70 C 62 70 65 76 65 76 C 65 76 68 70 75 70 C 88 70 100 80 100 95 C 100 118 65 145 65 145 Z" fill="#dc2626" />
  </g>

  <!-- Center Landlord Crown & Gold Shield -->
  <g transform="translate(256, 270)" filter="url(#glow)">
    <!-- Golden Badge -->
    <circle cx="0" cy="0" r="76" fill="url(#crownGrad)" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="0" r="68" fill="#d97706" />
    
    <!-- Crown Icon -->
    <path d="M -40 -15 L -25 25 L 25 25 L 40 -15 L 18 5 L 0 -30 L -18 5 Z" fill="url(#crownGrad)" stroke="#78350f" stroke-width="3" />
    <circle cx="-40" cy="-18" r="5" fill="#ffffff" />
    <circle cx="0" cy="-33" r="6" fill="#ffffff" />
    <circle cx="40" cy="-18" r="5" fill="#ffffff" />

    <!-- Text: 斗 -->
    <text x="0" y="48" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" stroke="#78350f" stroke-width="3" paint-order="stroke fill">斗</text>
  </g>

  <!-- Banner at bottom: 雀圣斗地主 -->
  <g transform="translate(256, 435)" filter="url(#glow)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="url(#crownGrad)" stroke="#ffffff" stroke-width="3" />
    <text x="0" y="9" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="900" fill="#1e1b4b" text-anchor="middle" letter-spacing="3">雀圣斗地主</text>
  </g>
</svg>
