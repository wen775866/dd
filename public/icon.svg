<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="50%" stop-color="#111f38" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.5" />

  <!-- Outer Ring -->
  <circle cx="256" cy="240" r="190" fill="#064e3b" stroke="#042f2e" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="240" r="180" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8,6" />

  <!-- Main Spade ♠️ Symbol -->
  <g transform="translate(256, 220)" filter="url(#glow)">
    <!-- Spade Head -->
    <path d="M 0 -130 C -80 -40 -135 20 -135 70 C -135 125 -70 145 -15 110 C -2 105 0 100 0 100 C 0 100 2 105 15 110 C 70 145 135 125 135 70 C 135 20 80 -40 0 -130 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" />
    <!-- Spade Stem -->
    <path d="M 0 85 L -28 140 C -10 142 10 142 28 140 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- Center Spade Gold Accent -->
    <path d="M 0 -80 C -35 -15 -60 20 -60 45 C -60 75 -25 85 0 60 C 25 85 60 75 60 45 C 60 20 35 -15 0 -80 Z" fill="url(#goldGrad)" opacity="0.95" />
  </g>

  <!-- Banner at bottom: 锄大地 -->
  <g transform="translate(256, 435)" filter="url(#glow)">
    <rect x="-130" y="-26" width="260" height="52" rx="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
    <text x="0" y="10" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="900" fill="#022c22" text-anchor="middle" letter-spacing="4">锄大地</text>
  </g>
</svg>
